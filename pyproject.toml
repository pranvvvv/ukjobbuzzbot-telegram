[project]
name = "jobpilot"
version = "0.1.0"
description = "Personal AI job-search agent with a Telegram front end: parses your resume, searches legitimate job APIs, explains every match."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.16"
authors = [{ name = "Pranav" }]
dependencies = [
    "aiogram>=3.33.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "httpx>=0.28.1",
    "tenacity>=9.0",
    "structlog>=26.1.0",
    "typer>=0.29.2",
    "rich>=15.0.0",
    "platformdirs>=4.14.8",
    "filelock>=4.2.12",
    "tzdata>=2026.6",
    "pyyaml>=6.0.4",
    "anthropic>=2.12.0",
    "openai>=3.57.0",
    "google-genai>=3.6.1",
    "pypdf>=7.1.1",
    "pdfplumber>=0.11.11",
    "python-docx>=1.2.0",
    "beautifulsoup4>=4.15.0",
    "rapidfuzz>=3.14.6",
    "aiolimiter>=1.3.0",
    "apscheduler>=3.11.3,<4",
    "fastembed>=0.9.1",
    "numpy>=2.5.5",
]

[project.scripts]
jobpilot = "jobpilot.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "time-machine>=3.6.0",
    "pre-commit>=4.7.0",
    "types-pyyaml>=6.0.12.20261113",
    "reportlab>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobpilot"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "PL", "PT", "DTZ", "TRY", "C4", "N",
]
ignore = [
    "PLR0913",  # many args is fine for service constructors
    "PLR0917",  # aiogram injects handler dependencies by parameter name
    "PLR2004",  # magic values in tests / thresholds are documented constants
    "TRY003",   # long messages in exceptions are intentional (user-facing)
    "S101",     # assert is used in tests
    "RUF001", "RUF002", "RUF003",  # typographic – ₹ × and emoji in user-facing text are deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PLR0915", "DTZ001", "PT018", "PLC0415", "E501", "C408"]
# Rule tables / orchestration read top-to-bottom; splitting them would hide the flow.
"jobpilot/matching/filters.py" = ["PLR0911", "PLR0912"]
"jobpilot/services/search.py" = ["PLR0915"]
"jobpilot/bot/handlers/jobs.py" = ["PLR0912", "PLR0915"]
"jobpilot/bot/handlers/questions.py" = ["PLR0912", "PLR0915"]
"jobpilot/resume/profile.py" = ["PLR0912"]
"jobpilot/db/migrations/**" = ["E501", "N999"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["jobpilot/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["jobpilot.core.*", "jobpilot.db.*", "jobpilot.llm.*", "jobpilot.services.*"]
strict = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "fastembed.*", "pdfplumber.*", "docx.*", "reportlab.*", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pytest fixtures are injected by name; annotating every fixture parameter adds noise.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: touches the DB / dispatcher end to end (still no network)"]
filterwarnings = ["error::DeprecationWarning:jobpilot.*"]

[tool.coverage.run]
source = ["jobpilot"]
# SQLAlchemy async runs ORM code in greenlets; aiosqlite connects on a worker thread.
concurrency = ["greenlet", "thread"]
omit = ["jobpilot/db/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
