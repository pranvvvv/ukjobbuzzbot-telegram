# JobPilot matching eval: 2 synthetic personas × 15 jobs = 30 labeled pairs.
# Labels (good / ok / bad) were drafted by Claude and are meant to be reviewed by a human
# (Pranav). Edit freely; `python -m jobpilot eval` recomputes the metrics.
personas:
  - id: fresher_backend_ai
    profile:
      full_name: Aarav (synthetic)
      location_current: Hyderabad
      is_student: true
      current_or_last_title: Backend Intern
      seniority: intern
      total_experience_years: 0
      internship_months: 3
      inferred_target_roles: [Backend Developer, AI Engineer, Full Stack Developer]
      skills:
