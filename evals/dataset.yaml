        frameworks: [FastAPI, Django, React, REST APIs, Pytest]
        tools: [Git, Docker, Linux, WhatsApp Business API, n8n]
        cloud: []
        databases: [PostgreSQL, Redis, pgvector]
        ml_ai: [LangChain, RAG, OpenAI API, Chatbots]
        soft: [Communication]
